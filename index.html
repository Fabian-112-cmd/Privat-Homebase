<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172644"><title>Privat Homebase</title><link rel="stylesheet" href="privat-design.css?v=3"><link rel="icon" href="homebase.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="homebase-180.png"></head><body><aside><a class="brand" href="./"><img src="homebase.svg" alt=""><span>Privat Homebase</span><small>Meine persönliche Zentrale</small></a><nav id="nav"></nav></aside><main><section class="hero"><small>PRIVAT HOMEBASE · DEINE ZENTRALE</small><h1 id="greeting">Willkommen</h1><p id="date"></p></section><div class="tiles" id="tiles"></div><div class="grid" id="apps"></div><section class="section"><h2>Aktuelle Informationen</h2><div class="note">Die Live-Datenanbindung ist noch nicht eingerichtet. Du kannst deine Apps direkt öffnen. Auf dieser Seite werden keine privaten Daten gespeichert.</div></section></main><div class="mobile" id="mobile"></div><script>
const base='https://fabian-112-cmd.github.io/';const apps=[{name:'Mein Alltag',short:'Alltag',icon:'alltag',url:base+'Mein-Leben/',items:['Offene Aufgaben','Einkaufsliste','Notizen','Anstehende Termine']},{name:'Unser Glück',short:'Glück',icon:'glueck',url:base+'Papa-App/',items:['Schwangerschaftswoche','Tage bis zur Geburt','Nächste Termine','Offene Aufgaben']},{name:'Meine Finanzen',short:'Finanzen',icon:'finanzen',url:base+'Finanz-App/',items:['Girokonto','Sparbuch','Einnahmen','Ausgaben','Offene Fixkosten']},{name:'Smart Home',short:'Smart Home',icon:'smart',url:'https://control.shelly.cloud/',items:['Heuchelheim','Ingenheim','Gerätestatus']}];const img=a=>`<img src="${a.icon}.svg" alt="">`;const link=a=>`href="${a.url}" target="_blank" rel="noopener"`;document.getElementById('nav').innerHTML='<a class="active" href="./">⌂ Übersicht</a>'+apps.map(a=>`<a ${link(a)}>${img(a)}${a.name}</a>`).join('');document.getElementById('tiles').innerHTML=apps.map(a=>`<a class="tile" ${link(a)}>${img(a)}${a.name}</a>`).join('');document.getElementById('apps').innerHTML=apps.map(a=>`<article class="card"><h2>${img(a)}${a.name}</h2>${a.items.map(i=>`<div class="metric"><span>${i}</span><b>—</b></div>`).join('')}<p class="status">Noch nicht verbunden</p><a class="open" ${link(a)}>App öffnen ↗</a></article>`).join('');document.getElementById('mobile').innerHTML='<a href="./"><img src="homebase.svg" alt="">Übersicht</a>'+apps.map(a=>`<a ${link(a)}>${img(a)}${a.short}</a>`).join('');const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const h=now.getHours();document.getElementById('greeting').textContent=(h<5?'Gute Nacht':h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend')+' 👋';
</script></body></html>

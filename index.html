<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172644"><title>Privat Homebase</title><link rel="stylesheet" href="privat-design.css?v=4.0"><link rel="icon" href="homebase.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="homebase-180.png"></head><body><aside><a class="brand" href="./"><img src="homebase.svg" alt=""><span>Privat Homebase</span><small>Meine persönliche Zentrale</small></a><nav id="nav"></nav></aside><main><section class="hero"><div class="hero-copy"><small>PRIVAT HOMEBASE · DEINE ZENTRALE</small><h1 id="greeting">Willkommen</h1><p id="date"></p></div><button type="button" id="weather" class="weather" aria-haspopup="dialog"><span>Heuchelheim-Klingen</span><strong id="weather-temp">— °C</strong><span id="weather-desc">Wetter wird geladen …</span><small id="weather-range">7-Tage-Vorhersage ›</small></button></section><dialog id="forecast"><div class="forecast-head"><h2>Wetter · Heuchelheim-Klingen</h2><button type="button" id="forecast-close" aria-label="Schließen">×</button></div><div id="forecast-days" aria-live="polite">Wetter wird geladen …</div><p class="status">Wetterdaten: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p></dialog><div id="tiles" hidden></div><div class="grid" id="apps"></div><div id="extras" class="grid"></div><section class="section"><h2>Persönliche Einstellungen</h2><div id="prefs"></div></section></main><div class="mobile" id="mobile"></div><script>
const base='https://fabian-112-cmd.github.io/';const apps=[{name:'Mein Alltag',short:'Alltag',icon:'alltag',url:base+'Mein-Leben/',items:['Offene Aufgaben','Einkaufsliste','Notizen','Anstehende Termine']},{name:'Unser Glück',short:'Glück',icon:'glueck',url:base+'Papa-App/',items:['Schwangerschaftswoche','Tage bis zur Geburt','Geburtstermin','Nächster Termin']},{name:'Meine Finanzen',short:'Finanzen',icon:'finanzen',url:base+'Finanz-App/',items:['Offene Rechnungen','Offene Fixkosten']},{name:'Smart Home',short:'Smart Home',icon:'smart',url:'https://control.shelly.cloud/',items:['Geräte online','Geräte offline','Licht eingeschaltet','Verbrauch','Raumtemperaturen']}];const img=a=>`<img src="${a.icon}.svg" alt="">`;const link=a=>`href="${a.url}" target="_blank" rel="noopener"`;document.getElementById('nav').innerHTML='<a class="active" href="./"><img src="homebase.svg" alt="">Übersicht</a>'+apps.map(a=>`<a ${link(a)}>${img(a)}${a.name}</a>`).join('');document.getElementById('tiles').innerHTML=apps.map(a=>`<a class="tile" ${link(a)}>${img(a)}${a.name}</a>`).join('');document.getElementById('apps').innerHTML=apps.map(a=>`<article class="card"><h2><a ${link(a)} style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">${img(a)}${a.name}</a></h2>${a.items.map(i=>`<div class="metric"><span>${i}</span><b>—</b></div>`).join('')}<p class="status">Noch nicht verbunden</p></article>`).join('');document.getElementById('mobile').innerHTML='<a href="./"><img src="homebase.svg" alt="">Übersicht</a>'+apps.map(a=>`<a ${link(a)}>${img(a)}${a.short}</a>`).join('');const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const h=now.getHours();document.getElementById('greeting').textContent=(h<5?'Gute Nacht':h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend')+' 👋';
</script><script src="homebase-weather.js?v=3.2"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="homebase-live.js?v=4"></script></body></html>
